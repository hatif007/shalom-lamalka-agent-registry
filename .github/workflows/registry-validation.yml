name: Registry validation

on:
  push:
    branches:
      - main
      - fix/registry-v0.2-structure
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registry:
    name: Validate registry structure and required fields
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON and registry metadata
        run: python scripts/validate_registry.py
      - name: Verify reference Data Agent fail-closed action guard (synthetic)
        run: python security/data_agent_action_guard.py
      - name: Validate Growth Manager calendar, scorecard and task board
        run: python scripts/validate_management.py
      - name: Unit-test native installed-agent API trigger flow (no network)
        run: python -m unittest discover -s tests -p 'test_ops007_*.py'
      - name: Unit-test allowlisted report promotion and immutable copies
        run: python -m unittest discover -s tests -p 'test_promote_agent_inbox.py'
      - name: Validate source-linked report archive and provenance
        run: python scripts/validate_report_archive.py
