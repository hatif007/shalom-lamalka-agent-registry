name: WEBSITE-QA-001 Public Wix Audit
on:
  workflow_dispatch:
  push:
    branches:
      - feature/website-qa-001
    paths:
      - '.github/workflows/website-qa-001.yml'
      - 'scripts/website-qa-001/**'
permissions:
  contents: read
concurrency:
  group: website-qa-001-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium --with-deps
      - name: Audit public pages (read only)
        run: node scripts/website-qa-001/audit.mjs
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-qa-001-evidence
          path: website-qa-output/
          if-no-files-found: warn
          retention-days: 14
